name: PhotonGuard CI

on:
  push:
    paths:
      - "app/source/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/source/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photonguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Full offline suite (official Meep runtime, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEEPSEEK_API_KEY: ""
      PHOTONGUARD_CI_OFFLINE: "1"
      PYTHONPATH: ${{ github.workspace }}/app/source:${{ github.workspace }}/app/source/tests
    defaults:
      run:
        shell: bash -el {0}
        working-directory: app/source

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up official PhotonGuard runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: app/source/runtime/environment.yml
          cache-environment: true
          init-shell: bash
          post-cleanup: all

      - name: Install PhotonGuard package without changing locked runtime
        run: python -m pip install --no-deps -e .

      - name: Verify official numerical runtime
        run: |
          python - <<'PY'
          import meep
          from meep import mpb
          import numpy, scipy, h5py
          print("Meep:", meep.__version__)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("h5py:", h5py.__version__)
          print("MPB:", mpb.__name__)
          PY

      - name: Collect tests
        run: python -m pytest -p photonguard_ci_network_guard --collect-only -q

      - name: Run full offline test suite
        run: |
          mkdir -p test-results
          python -m pytest -p photonguard_ci_network_guard -q \
            --junitxml=test-results/junit.xml

      - name: Reproduce public LEOI-30A single-slit case
        run: python examples/public_data/leoi30a_single_slit/analyze.py --out public-case-output

      - name: Add test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results/junit.xml")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report.exists():
              summary.write_text("## PhotonGuard CI\n\nJUnit report was not generated.\n", encoding="utf-8")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## PhotonGuard CI test summary\n\n")
              handle.write("| Metric | Count |\n|---|---:|\n")
              for key, value in totals.items():
                  handle.write(f"| {key} | {value} |\n")
          PY

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photonguard-junit-python312
          path: |
            app/source/test-results/junit.xml
            app/source/public-case-output/
          if-no-files-found: warn
